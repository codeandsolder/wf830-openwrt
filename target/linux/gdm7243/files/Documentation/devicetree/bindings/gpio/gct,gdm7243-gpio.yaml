%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/gct,gdm7243-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GCT GDM7243 application-CPU banked GPIO controller

maintainers:
  - codeandsolder <codeandsolder@gmail.com>

description: |
  A set of 32-bit GPIO banks with direction at 0xfc002080 + bank*4
  and input/output data at 0xfc0020c0 + bank*4. The vendor kernel
  represents each pin as (bank << 8) | bit, with bit in [0, 31].
  Modern Linux uses contiguous GPIO offsets bank*32 + bit instead.
  The direction/data arrays can address at most 16 banks before
  the next register group. The vendor GPIO interrupt helpers support
  only banks 0 through 6. Two independently maskable interrupt channels
  share mode and polarity registers; their bank-level summaries, masks,
  and pending bits occupy later registers in the same MMIO aperture.
  Each GPIO IRQ line is bound to exactly one interrupt channel by
  the fixed board routing property gct,irq1-mask.

properties:
  compatible:
    const: gct,gdm7243-gpio

  reg:
    maxItems: 1

  interrupts:
    minItems: 2
    maxItems: 2

  interrupt-names:
    items:
      - const: gpio0
      - const: gpio1

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

  gct,irq1-mask:
    description: |
      Seven 32-bit words, one per interrupt-capable GPIO bank (0-6).
      A set bit routes that pin's interrupt to GPIO1 (parent IRQ 29);
      a clear bit routes it to GPIO0 (parent IRQ 10). This fixes the
      route for the lifetime of the GPIO chip; no hardware route mux
      is required because each pin has separate enable masks for both
      channels.
    minItems: 7
    maxItems: 7
    items:
      minimum: 0
      maximum: 4294967295

  gpio-controller: true

  '#gpio-cells':
    const: 2

  gpio-ranges:
    maxItems: 1
    description: |
      All 224 IRQ-capable pinctrl offsets map identically to GPIO
      offsets 0..223. Unbonded or unsupported pins must additionally
      be excluded using gpio-reserved-ranges.

  ngpios:
    minimum: 1
    maximum: 512
    description: >
      Number of populated GPIO lines, including any reserved holes.
      The physical pins and absent lines must be determined by board
      pad/pinmux data.

required:
  - compatible
  - reg
  - gpio-controller
  - '#gpio-cells'
  - ngpios
  - interrupts
  - interrupt-names
  - interrupt-controller
  - '#interrupt-cells'

allOf:
  - $ref: /schemas/gpio/gpio.yaml#

unevaluatedProperties: false

examples:
  - |
    gpio@fc002080 {
        compatible = "gct,gdm7243-gpio";
        reg = <0xfc002080 0x320>;
        interrupts = <10>, <29>;
        interrupt-names = "gpio0", "gpio1";
        gpio-controller;
        #gpio-cells = <2>;
        interrupt-controller;
        #interrupt-cells = <2>;
        ngpios = <224>;
        gct,irq1-mask = <0 0 0 0 0 0 0>;
    };
...
