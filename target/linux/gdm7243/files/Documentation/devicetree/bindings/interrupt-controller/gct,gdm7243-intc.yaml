%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/gct,gdm7243-intc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GCT GDM7243 integrated interrupt controller

maintainers:
  - codeandsolder <codeandsolder@gmail.com>

description: |
  The GDM7243QT application processor has a root controller for 64
  level-triggered sources in two 32-bit banks. Hardware IRQ 19 was
  explicitly excluded by the OEM kernel. The register block is
  memory-mapped at 0xfc002c00.

properties:
  compatible:
    const: gct,gdm7243-intc

  reg:
    maxItems: 1

  interrupt-controller: true

  '#interrupt-cells':
    const: 1

required:
  - compatible
  - reg
  - interrupt-controller
  - '#interrupt-cells'

additionalProperties: false

examples:
  - |
    interrupt-controller@fc002c00 {
        compatible = "gct,gdm7243-intc";
        reg = <0xfc002c00 0x60>;
        interrupt-controller;
        #interrupt-cells = <1>;
    };
...
