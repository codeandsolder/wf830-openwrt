%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/gct,gdm7243-rtccs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GCT GDM7243 always-on 32.768 kHz RTC counter

maintainers:
  - codeandsolder <codeandsolder@gmail.com>

description: |
  The GDM7243QT integrates an always-on 32-bit count-up register at
  physical 0xfc000604, clocked by a 32.768 kHz oscillator. The stock
  Polish P4 kernel uses it as sched_clock and the "rtccs" clocksource.
  It is not the separate interrupt-generating system tick timer.

properties:
  compatible:
    const: gct,gdm7243-rtccs

  reg:
    maxItems: 1

  clock-frequency:
    const: 32768

required:
  - compatible
  - reg
  - clock-frequency

additionalProperties: false

examples:
  - |
    timer@fc000600 {
        compatible = "gct,gdm7243-rtccs";
        reg = <0xfc000600 0x20>;
        clock-frequency = <32768>;
    };
...
