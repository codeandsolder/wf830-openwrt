%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/gct,gdm7243-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GCT GDM7243QT periodic system timer

maintainers:
  - codeandsolder <codeandsolder@gmail.com>

description: |
  The application processor's timer consists of a reload word at
  offset 0 and a control word at offset 0x10. The Polish P4 kernel
  uses hardware interrupt 18 to deliver periodic ticks. Its timer
  clock is obtained from the SoC clock tree, not presumed constant.
  The existing firmware only implements periodic mode.

properties:
  compatible:
    const: gct,gdm7243-timer

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    clocks: clock-controller@fc000000 {
        compatible = "gct,gdm7243-clocks";
        reg = <0xfc000000 0x500>;
        #clock-cells = <1>;
    };

    timer@fc006c40 {
        compatible = "gct,gdm7243-timer";
        reg = <0xfc006c40 0x20>;
        interrupts = <18>;
        clocks = <&clocks 7>;
    };
...
