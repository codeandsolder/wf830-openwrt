%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/gct,gdm7243-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GCT GDM7243QT seven-bank pin mux controller

maintainers:
  - codeandsolder <codeandsolder@gmail.com>

description: |
  The application CPU has 63 OEM pin mux groups spanning 131
  documented pads in seven 32-pin banks. Selector words occupy
  consecutive physical addresses 0xfc000500 through 0xfc000518.
  Pin numbers use normal GPIO offsets (bank * 32 + pin).
  Some independently named groups share physical mux fields,
  notably GPE 0-10 and 12-15; they must select compatible
  modes and are arbitrated by the driver.
  Peripheral pad configuration (pulls, drive strength, etc.)
  is not described by the available source material.

properties:
  compatible:
    const: gct,gdm7243-pinctrl

  reg:
    maxItems: 1

patternProperties:
  '-pins$':
    type: object
    additionalProperties: false

    properties:
      function:
        enum:
          - anfc
          - ant-sw
          - ant-swb
          - arm0-trace
          - arm1-trace
          - clk-out
          - ds
          - gnfc
          - gpio
          - i2c
          - i2s
          - jtag
          - jtag-arm-rtck
          - keypad
          - lna
          - lte-tp
          - mii
          - pa-mode
          - pa1-pe
          - pa2-pe
          - pcm
          - reset-out
          - rffe
          - rgmii
          - rmii
          - sddev
          - sdhost
          - sdhost1
          - spi
          - spi-cs1
          - spi-cs2
          - spi-cs3
          - tr-sw
          - tr-swb
          - uart0
          - uart1
          - uart2
          - uart3
          - ulpi-dev
          - ulpi-host
          - usim
          - wb-tp
      groups:
        $ref: /schemas/types.yaml#/definitions/string-array
        minItems: 1
        maxItems: 63
        uniqueItems: true
        items:
          enum:
            - gpa-0
            - gpa-1
            - gpa-2
            - gpa-3-6
            - gpa-7
            - gpb-0-13
            - gpc-0-3
            - gpc-4-7
            - gpc-8-9
            - gpc-10
            - gpc-11
            - gpc-12
            - gpc-13-15
            - gpc-16
            - gpd-0-3
            - gpd-4-7
            - gpd-8-9
            - gpd-10
            - gpd-11
            - gpd-12-13
            - gpd-14-15
            - gpd-16-17
            - gpd-18-23
            - gpe-0-10
            - gpe-11
            - gpe-12-15
            - gpe-16
            - gpf-0
            - gpf-1
            - gpf-2
            - gpf-3
            - gpf-4
            - gpf-5
            - gpf-6
            - gpf-7
            - gpf-8
            - gpf-9
            - gpf-10
            - gpf-11
            - gpf-12
            - gpf-13
            - gpf-14
            - gpf-15
            - gpf-16
            - gpf-17
            - gpf-18
            - gpf-19
            - gpf-20
            - gpf-21
            - gpf-22-23
            - gpg-0-3
            - gpg-4
            - gpg-5
            - gpg-6
            - gpg-7-8
            - gpg-9-10
            - gpg-11-12
            - gpg-13-14
            - gpg-15
            - gpg-16-18
            - gpg-19-22
            - gpg-23-24
            - gpg-25-26

    required:
      - function
      - groups

allOf:
  - $ref: pinctrl.yaml#

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    pinctrl: pinctrl@fc000500 {
        compatible = "gct,gdm7243-pinctrl";
        reg = <0xfc000500 0x1c>;

        uart0-pins {
            function = "uart0";
            groups = "gpg-9-10";
        };

        ethernet-pins {
            function = "rgmii";
            groups = "gpe-0-10", "gpe-12-15";
        };
    };
...
