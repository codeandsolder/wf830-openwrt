%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/gct,gdm7243-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GCT GDM7243 application CPU UART0-2

maintainers:
  - codeandsolder <codeandsolder@gmail.com>

description: |
  The application processor has three UARTs sharing the same register
  layout, with TX at offset 0 and TX_FULL at status offset 0x14 bit 2.
  A fourth UART has a different register layout and is not compatible.
  The early console relies on the bootloader setting baud and clock.
  The full serial driver supports receive, transmit, error flags,
  framing, baud programming and a normal console. UART3 is separate.
  GPIO-based RTS/CTS requires board-specific pad-mux integration.

properties:
  compatible:
    const: gct,gdm7243-uart

  reg:
    maxItems: 1

  interrupts:
    minItems: 2
    maxItems: 2
    description: Receive and transmit interrupt lines, respectively

  interrupt-names:
    items:
      - const: rx
      - const: tx

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks

additionalProperties: false

examples:
  - |
    clocks: clock-controller@fc000000 {
        compatible = "gct,gdm7243-clocks";
        reg = <0xfc000000 0x500>;
        #clock-cells = <1>;
    };

    serial@fc007500 {
        compatible = "gct,gdm7243-uart";
        reg = <0xfc007500 0x40>;
        interrupts = <2>, <3>;
        interrupt-names = "rx", "tx";
        clocks = <&clocks 8>;
    };
...
